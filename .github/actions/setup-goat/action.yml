name: Setup goat (atproto CLI)
description: >-
  Internal action of lexicon-actions, not a supported public interface: its
  inputs and outputs may change without a major version. Installs a pinned,
  SHA-256-verified release of goat, the AT Protocol (Bluesky) command-line
  tool, and adds it to PATH. Linux x86_64 and arm64 runners only.
author: thisismissem

inputs:
  goat-version:
    description: >-
      goat release tag to install, for example v0.2.9. It must be listed in
      goat-checksums.txt for the runner architecture.
    required: false
    default: v0.2.9

outputs:
  goat-path:
    description: Full path to the installed goat binary.
    value: ${{ steps.install.outputs.goat-path }}

runs:
  using: composite
  steps:
    # The relative path to scripts/ is valid because this action is internal and
    # only ever used from a full checkout of lexicon-actions (the `.lexicon-actions`
    # checkout in the workflows, or this repo's own checkout in test.yml).
    - name: Install goat
      id: install
      shell: bash
      env:
        GOAT_VERSION: ${{ inputs.goat-version }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
        GOAT_CHECKSUMS_FILE: ${{ github.action_path }}/goat-checksums.txt
      run: "$GITHUB_ACTION_PATH/../../../scripts/install-goat.sh"
