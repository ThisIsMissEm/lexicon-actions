name: Comment lexicon results (reusable)

# Reusable, privileged workflow. The caller owns the trigger:
#
#   on:
#     workflow_run:
#       workflows: ["Validate lexicon"]
#       types: [requested, completed]
#   permissions: {}
#
# and calls this from a job that grants `pull-requests: write` and
# `actions: read`. It runs in the caller's context, so `github.event.workflow_run`,
# `github.repository`, `github.token` and `github.workflow` all refer to the
# adopter's repository. Posts a pull request comment when the caller's
# validate workflow starts and finishes.
#
# No code from the pull request runs here, and the adopter's repository is never
# checked out. The only checkout is this repository's own scripts, pinned to the
# commit the caller referenced. The pull request is looked up from trusted event
# data via the API; the `lexicon-check-logs` artifact produced by the PR run is treated
# as untrusted data.
#
# Jobs:
# - gather:      finds the open PR whose head is the checked commit (read-only).
# - in-progress: on `requested`, marks the PR comment as in progress.
#
# Comment identity: every comment carries a hidden marker line, and
# scripts/upsert-comment.sh updates the last Bot-authored comment containing it
# (or creates one). When `client-id` is set, the two commenting jobs mint a
# short-lived GitHub App token (pull requests: write only) and the steps that
# write comments use it; `gather` and the artifact download use github.token.
# - publish:     on `completed`, posts the results from the artifact, or a
#                "no lexicon changes" note when validate.yml skipped the checks.
#
# Concurrency is set only on the two commenting jobs, not on the workflow or on
# `gather`. Only the latest state per PR branch matters, so a newer commenting
# job replaces an older one. A job skipped by its `if:` (a cancelled,
# superseded run, or a run where `gather` found no matching PR) never joins the
# group, so it can't cancel the newer push's commenting job.
on:
  workflow_call:
    inputs:
      client-id:
        description: >-
          Client ID (Iv…) of a GitHub App to post the comment as. Needs the
          `app-private-key` secret. When empty, comments are posted as
          github-actions[bot] using the workflow's GITHUB_TOKEN.
        type: string
        default: ""
    secrets:
      app-private-key:
        description: >-
          Private key of the GitHub App named by `client-id`. The App needs
          Pull requests: Read & write, installed on this repository.
        required: false

permissions: {}

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A cancelled run has been superseded by a newer one, which will comment.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      !(github.event.action == 'completed' && github.event.workflow_run.conclusion == 'cancelled')
    permissions:
      pull-requests: read
    outputs:
      found: ${{ steps.pr.outputs.found }}
      number: ${{ steps.pr.outputs.number }}
    steps:
      # Find the open PR whose head is exactly the commit being checked. If the
      # PR has moved on to a newer commit, there's nothing to report.
      - name: Find pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -o pipefail
          if [ -z "$HEAD_OWNER" ] || [ -z "$HEAD_BRANCH" ]; then
            echo "::notice::Head repository or branch is unavailable; not commenting."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr_number="$(gh api --method GET "repos/$REPO/pulls" \
            -f head="$HEAD_OWNER:$HEAD_BRANCH" -f state=open \
            | jq -r --arg sha "$HEAD_SHA" 'map(select(.head.sha == $sha)) | first | .number // empty')"
          if [ -z "$pr_number" ]; then
            echo "::notice::No open pull request has $HEAD_SHA as its head (superseded by a newer push?); not commenting."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "::error::Unexpected pull request number from the API"
            exit 1
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

  in-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: gather
    if: needs.gather.outputs.found == 'true' && github.event.action == 'requested'
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    permissions:
      pull-requests: write
    steps:
      # Only this reusable workflow's own repository, at the commit being run.
      - name: Checkout lexicon-actions
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .lexicon-actions
          persist-credentials: false

      # Optional: comment as a GitHub App instead of github-actions[bot]. The
      # token is scoped to pull requests: write on this repository only. If
      # this step is skipped or fails, the commenting steps fall back to
      # github.token.
      - name: Create GitHub App token
        id: app-token
        if: inputs.client-id != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-pull-requests: write

      - name: Mark pull request results as in progress
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          PULL_REQUEST: ${{ needs.gather.outputs.number }}
          MARKER: "<!-- lexicon-actions:validation -->"
        run: |
          printf '%s\n' "## ⏳ Validation in progress" > "$RUNNER_TEMP/in-progress.txt"
          .lexicon-actions/scripts/upsert-comment.sh "$RUNNER_TEMP/in-progress.txt"

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gather
    if: needs.gather.outputs.found == 'true' && github.event.action == 'completed'
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    permissions:
      pull-requests: write
      actions: read
    steps:
      # SECURITY: the adopter's repository is never checked out. This job holds
      # a write token, so it only fetches this reusable workflow's own
      # repository at the exact commit being run (`job.workflow_sha`), giving
      # the reviewed scripts/format-comment.js.
      - name: Checkout lexicon-actions
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .lexicon-actions
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      # Optional: comment as a GitHub App instead of github-actions[bot]. The
      # token is scoped to pull requests: write on this repository only. If
      # this step is skipped or fails, the commenting steps fall back to
      # github.token.
      - name: Create GitHub App token
        id: app-token
        if: inputs.client-id != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-pull-requests: write

      # If the artifact is missing (e.g. CI failed before uploading it), keep
      # going so the in-progress comment is replaced with an error instead of
      # being left behind. The metadata step below handles that case.
      #
      # The artifact is untrusted, so it goes in the runner temp directory, not
      # the workspace: a crafted artifact can't overwrite `.lexicon-actions/`.
      - name: Download check results
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: lexicon-check-logs
          path: ${{ runner.temp }}/check-logs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - if: steps.download.outcome == 'success'
        env:
          LOGS_DIR: ${{ runner.temp }}/check-logs
        run: ls -R "$LOGS_DIR"

      # The artifact is untrusted. Validate its metadata here and pass it on
      # only through step outputs and env vars, never via `${{ }}` in `run:`.
      # The PR number used for commenting always comes from `gather`; the
      # artifact's `pr` is only checked for consistency with it. If the
      # artifact couldn't be downloaded, nothing from it is used:
      # `validated=false` makes format-comment.js post an error comment.
      - name: Validate artifact metadata
        id: meta
        env:
          EXPECTED_PR: ${{ needs.gather.outputs.number }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          LOGS_DIR: ${{ runner.temp }}/check-logs
        run: |
          if [ "$DOWNLOAD_OUTCOME" != "success" ]; then
            echo "::warning::The lexicon-check-logs artifact was unavailable; reporting the run as incomplete."
            echo "validated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -f "$LOGS_DIR/meta.json" ]; then
            echo "::error::meta.json is missing from the artifact"
            exit 1
          fi
          # Consistency check: the artifact must be for the PR `gather` found.
          # Not the security boundary; the comment always goes to `gather`'s PR.
          # Fails on invalid JSON, a missing `.pr`, or any other value.
          if ! jq -e --argjson pr "$EXPECTED_PR" '.pr == $pr' "$LOGS_DIR/meta.json" >/dev/null; then
            echo "::error::meta.json is invalid or is for a different pull request"
            exit 1
          fi

          validated=false
          if jq -e '.finished == true' "$LOGS_DIR/meta.json" >/dev/null; then
            validated=true
          fi

          # validate.yml's change-detection job marks runs where no lexicons changed.
          skipped=false
          if jq -e '.skipped == true' "$LOGS_DIR/meta.json" >/dev/null; then
            skipped=true
          fi

          echo "validated=$validated" >> "$GITHUB_OUTPUT"
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"

      - name: Prepare skipped comment
        if: steps.meta.outputs.skipped == 'true'
        run: |
          printf '%s\n\n%s\n' "## ✅ No lexicon changes" \
            "This pull request doesn't change any lexicons, so no lexicon checks were run." > "$RUNNER_TEMP/comment.txt"

      - name: Prepare comment
        if: steps.meta.outputs.skipped != 'true'
        env:
          VALIDATED: ${{ steps.meta.outputs.validated }}
          LOGS_DIR: ${{ runner.temp }}/check-logs
        run: |
          node .lexicon-actions/scripts/format-comment.js "$LOGS_DIR" > "$RUNNER_TEMP/comment.txt"

      - name: Print comment
        run: cat "$RUNNER_TEMP/comment.txt"

      - name: Add comment to pull request with results
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          PULL_REQUEST: ${{ needs.gather.outputs.number }}
          MARKER: "<!-- lexicon-actions:validation -->"
          COMMENT_FILE: ${{ runner.temp }}/comment.txt
        run: .lexicon-actions/scripts/upsert-comment.sh "$COMMENT_FILE"

      # If anything above failed, replace the in-progress comment so the PR
      # isn't left showing ⏳. Uses only trusted data: gather's PR number and
      # the github context. Nothing from the artifact. The job still fails.
      #
      # This step deliberately carries its own minimal copy of the upsert in
      # scripts/upsert-comment.sh instead of calling it: it must work even when
      # the checkout of our files is what failed. Keep the two in step,
      # including the `.user.type == "Bot"` check (a user can't be a Bot, so
      # we never edit a user's comment that merely contains the marker).
      - name: Report comment workflow failure
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          PULL_REQUEST: ${{ needs.gather.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MARKER: "<!-- lexicon-actions:validation -->"
        run: |
          set -euo pipefail
          printf '%s\n\n%s\n\n%s\n' "## ‼️ Couldn't report validation results" \
            "See the [comment workflow run]($RUN_URL) for details." "$MARKER" > "$RUNNER_TEMP/failure.txt"
          comment_id="$(gh api --paginate "repos/$REPO/issues/$PULL_REQUEST/comments" \
            | jq -rs --arg marker "$MARKER" \
              'add // [] | map(select(.user.type == "Bot" and ((.body // "") | contains($marker)))) | last | .id // empty')"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" -F "body=@$RUNNER_TEMP/failure.txt" >/dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PULL_REQUEST/comments" -F "body=@$RUNNER_TEMP/failure.txt" >/dev/null
          fi
