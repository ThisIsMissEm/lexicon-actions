name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - run: node --test "test/**/*.test.js"

  setup-goat:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        id: goat
      - name: Assert goat is installed
        env:
          GOAT_PATH: ${{ steps.goat.outputs.goat-path }}
        run: |
          test -x "$GOAT_PATH"
          goat -v | tee goat-version.txt
          grep -F "0.2.9" goat-version.txt

  setup-goat-bad-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        id: goat
        continue-on-error: true
        with:
          goat-version: "v0.2.9; echo pwned"
      - name: Assert the install failed
        env:
          OUTCOME: ${{ steps.goat.outcome }}
        run: test "$OUTCOME" = "failure"

  setup-goat-unpinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        id: goat
        continue-on-error: true
        with:
          goat-version: v0.2.8
      - name: Assert the install failed
        env:
          OUTCOME: ${{ steps.goat.outcome }}
        run: test "$OUTCOME" = "failure"

  pin-goat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Pin tool reproduces the committed v0.2.9 checksums
        run: diff <(scripts/pin-goat.sh v0.2.9) <(grep '^v0.2.9 ' goat-checksums.txt)

  actionlint:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: "1.7.7"
    steps:
      - uses: actions/checkout@v6
      - name: Install actionlint
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -O "${base}/${asset}"
          curl -fsSL -O "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep -F "  ${asset}" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum --check -
          tar -xzf "${asset}" actionlint
      - name: Run actionlint
        run: ./actionlint -color
