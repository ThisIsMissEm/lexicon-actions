name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      # `node --test` exits 0 when the glob matches nothing, so guard the count.
      - name: Run unit tests
        run: |
          shopt -s nullglob
          tests=(test/*.test.js)
          if [ "${#tests[@]}" -lt 4 ]; then
            echo "::error::Expected at least 4 test/*.test.js files, found ${#tests[@]}"
            exit 1
          fi
          node --test "test/**/*.test.js"

  setup-goat:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-goat
        id: goat
      - name: Assert goat is installed
        env:
          GOAT_PATH: ${{ steps.goat.outputs.goat-path }}
        run: |
          test -x "$GOAT_PATH"
          goat -v | tee goat-version.txt
          grep -F "0.2.9" goat-version.txt

  setup-goat-bad-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-goat
        id: goat
        continue-on-error: true
        with:
          goat-version: "v0.2.9; echo pwned"
      - name: Assert the install failed
        env:
          OUTCOME: ${{ steps.goat.outcome }}
        run: test "$OUTCOME" = "failure"

  setup-goat-unpinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-goat
        id: goat
        continue-on-error: true
        with:
          goat-version: v0.2.8
      - name: Assert the install failed
        env:
          OUTCOME: ${{ steps.goat.outcome }}
        run: test "$OUTCOME" = "failure"

  pin-goat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Pin tool reproduces the committed v0.2.9 checksums
        run: diff <(scripts/pin-goat.sh v0.2.9) <(grep '^v0.2.9 ' .github/actions/setup-goat/goat-checksums.txt)

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Official actionlint image (rhysd/actionlint:1.7.7), pinned by digest so
      # the tag can't be moved under us. To bump: take the new tag's digest from
      # https://hub.docker.com/r/rhysd/actionlint/tags
      - name: Run actionlint
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
        with:
          args: -color
