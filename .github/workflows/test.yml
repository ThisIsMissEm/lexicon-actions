name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - run: node --test "test/**/*.test.js"

  actionlint:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: "1.7.7"
    steps:
      - uses: actions/checkout@v6
      - name: Install actionlint
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -O "${base}/${asset}"
          curl -fsSL -O "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep -F "  ${asset}" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum --check -
          tar -xzf "${asset}" actionlint
      - name: Run actionlint
        run: ./actionlint -color
