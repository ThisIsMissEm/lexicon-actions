version: 2
updates:
  - package-ecosystem: github-actions
    # "/" covers .github/workflows; the glob covers local composite actions.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    # Don't take a release until it has been out for 7 days, so a compromised
    # release has time to be caught and pulled.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
